<!DOCTYPE html>
<html>
<head>
<style>
.yellow {
    background-color: yellow;
    font-size: 24px;
}
</style>
</head>
<body>

<p id="teksti">Hello World!</p>

<button onclick="ndryshoStilin()">Kliko këtu</button>

<script>
function ndryshoStilin() {
    document.getElementById("teksti").classList.add("yellow");
}
</script>

</body>
</html>
